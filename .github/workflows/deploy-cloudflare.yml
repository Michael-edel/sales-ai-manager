name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            parser-service/requirements.txt
            parser-service/requirements-dev.txt

      - name: Install parser-service dependencies
        working-directory: parser-service
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test parser-service
        working-directory: parser-service
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply sales-ai-manager --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
