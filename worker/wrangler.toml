name = "sales-ai-manager"
main = "src/index.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]
account_id = "3e2a044cfaf01abb436adfe910297e5c"
workers_dev = true
# Preserve service URLs managed in the Cloudflare dashboard during CI deployments.
keep_vars = true

[[durable_objects.bindings]]
name = "PASSWORD_KDF"
class_name = "PasswordKdf"

[[migrations]]
tag = "v1-password-kdf"
new_sqlite_classes = ["PasswordKdf"]

[[routes]]
pattern = "ai.michael.kz"
custom_domain = true

[vars]
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_TRANSCRIBE_MODEL = "gemini-3.5-flash"
GEMINI_RETRY_ATTEMPTS = "3"
GEMINI_RETRY_BASE_DELAY_MS = "800"
WHATSAPP_API_VERSION = "v24.0"
ACCESS_USERNAME = "manager"
ONEC_MCP_ALLOWED_TOOLS = "get_metadata_tree,get_object_structure,get_form_structure,get_configuration_info,execute_query,validate_query"

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sales-ai-manager"
database_id = "5c15e8fa-320e-435a-a4ba-8f4925ee0490"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EMAIL_ATTACHMENTS"
bucket_name = "sales-ai-manager-email-attachments"
